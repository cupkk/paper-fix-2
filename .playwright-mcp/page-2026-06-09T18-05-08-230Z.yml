                      - text: retrieved evidence that may become outdated or disputed. 8 Conclusion This paper presented FRAA, a retrieval-augmented model for explainable finan- cial risk assessment. FRAA combines time-aware sequence modeling, timestamp- valid knowledge retrieval, cross-attention evidence fusion, calibrated risk scoring, and explanation generation. On a large-scale proprietary multi-source dataset, FRAA achieves the lowest Log Loss and highest Recall@5 among the evalu- ated models. Ablations show that dynamic behavior, temporal encoding, and retrieval provide complementary evidence, while feature-group occlusion identi-
