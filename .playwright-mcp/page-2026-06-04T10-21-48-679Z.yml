                    - generic [ref=e707]: "FISCAL for Financial Risk Surveillance 7 Inside the encoder, for a given query q ∈ Q j we sample a random key set K ′ of size u j i log L K j and evaluate P ( q , K ′ ) = max k ∈ K ′ a qk − 1 | K ′ | X k ∈ K ′ a qk , a qk = qk ⊤ √ d . (6) Here L K j and L Q j denote the key and query sequence lengths for modality j . Only the top υ j i = u j i log L Q j queries are retained per head, and the attention output is ¯ s j = Softmax \x12 ¯ Q j ( K j ) ⊤ √ d \x13 V j , (7) where ¯ Q j contains the selected queries. A standard residual connection and 1D-convolutional distillation (with leaky ReLU activation for gradient flow) are applied to obtain the final intra-modal embedding z j i ∈ R d j × L j . 3.4 Multi-Agent Collaboration with Retrieval-Augmented Memory Agent Roles and Communication Backbone The multi-agent module contains three specialist agents. The Monitor Agent A mon assesses risk levels from raw data and updates attention budgets by producing r i . The Analyst Agent A ana interprets the multimodal context by attending over tokenized summaries and the retrieval memory. The Decision Agent A dec produces the final risk prediction and an explanation anchored in retrieved precedents. Agents communicate through a shared sparse cross-modal attention canvas (the multimodal sequence c i , analogous to concatenation) and via dedicated message vectors. These messages are learned vector states rather than free-form text: the monitor message contains the modality risk scores and availability mask, the analyst message summarizes the attended multimodal context, and the decision message concatenates the analyst state with retrieved-case evidence before routing. We form the multimodal sequence from the intra-modal encodings after adding learned modality and temporal position embeddings: ˆ z j i = z j i + E j mod + P j time , c i = [ˆ z 1 i ∥ ˆ z 2 i ∥ . . . ∥ ˆ z M i ] ∈ R d × L tot . (8) where ∥ denotes temporal concatenation. Sparse Agent-Aware Cross-Modal Attention The analyst agent A ana refines c i using sparse cross-modal attention where the query matrix is a learned linear combination of the agent’s context state h ana i and the modality-specific queries: Q c = c i W Q + H ana i U Q , (9) with H ana i formed by tiling the state vector h ana i across the temporal dimension. The key and value matrices are obtained solely from c i . The sparsity budget is"
                  - generic "Page ⁨8⁩" [ref=e708]:
                    - generic [ref=e710]: "8 Anonymous Authors set to a fixed fraction (controlled by the monitor’s risk budget, but smoothed to avoid abrupt changes), yielding: ¯ c i = SparseCrossAttn ( Q c , K c , V c ; u cross ) , (10) where u cross = ρ max j u j i and ρ controls the cross-modal sparsity fraction. The output ¯ c i is then refined by a lightweight feed-forward network with a gated linear unit (GLU) to produce the analyst embedding e ana i . Retrieval-Augmented Case Memory A central component of Fiscal is a retrieval-augmented case base B that stores historical risk episodes. In the evaluation protocol, the memory bank is constructed only from training episodes to avoid test leakage. After a warm-up encoder pass, each training episode is stored as a tuple ( e hist , risk_label , explanation_template , case_notes , a sym ) , where a sym records sparse symbolic alerts such as <HI> , <LO> , and <MISS> . The memory bank is fixed during validation and testing. Given the analyst embedding e ana i , we perform a two-stage retrieval. First, approximate nearest-neighbor search over e hist forms a candidate set K cand , and dense retrieval then computes bilinear similarity scores within this set: α i,k = exp( e ana i W mem e hist k /τ ) P k ′ ∈K cand exp( e ana i W mem e hist k ′ /τ ) , k ∈ K cand . (11) Here W mem is a learned bilinear memory metric and τ is a temperature parameter. Second, a sparse keyword gate filters entries based on the overlap between the current alert symbols and a sym (e.g., <HI> appearing in corresponding order-book windows), so retrieved cases share a similar alert pattern rather than only a similar dense embedding. The two-stage design follows the same efficiency motivation as approximate nearest-neighbor retrieval systems [ ? , ? ]. Let K i ⊆ K cand denote the retained cases after this gate. The aggregated memory vector is m i = X k ∈K i α i,k v hist k , (12) where v hist k is a compressed representation of the episode’s explanation and case notes. The memory vector m i is then fused with e ana i through a cross-attention gate to form the decision state d i : d i = β i e ana i + (1 − β i ) m i , β i = σ \x00 w ⊤ β [ e ana i ; m i ] \x01 . (13) This mechanism uses past patterns for prediction and lets the decision agent refer to concrete historical precedents. It is inspired by retrieval-augmented models [ ? ] but uses structured case entries rather than open-domain documents."
