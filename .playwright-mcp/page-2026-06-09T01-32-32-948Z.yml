                      - text: "FRAA for Financial Risk Assessment 13 7 Limitations and Reproducibility The evaluation uses a proprietary financial dataset that cannot be publicly re- leased because it contains sensitive user-level risk and transaction information. This limits independent replication. To support reproducibility within this con- straint, we report the data scale, feature families, chronological split, training configuration, retrieval depth, baselines, and ablation settings. The knowledge base is timestamped, and retrieval uses only documents available at or before the scoring time. These details make the experimental protocol auditable even when the raw records cannot be shared. Several claims should be read within this scope. First, the results estab- lish performance in one large multi-source financial environment, not universal transfer across institutions. Second, the business-utility analysis is based on of- fline replay and should not be interpreted as causal online impact evidence. Third, the current evaluation does not report multi-seed variance or formal sta- tistical significance tests because the available audit record contains one fixed proprietary chronological split rather than repeated independent training runs. Fourth, the explanation evaluation measures expert-perceived faithfulness and readability for high-risk test predictions. It does not remove the need for hu- man oversight in regulated decisions. Future work should add public benchmark evaluations where legally possible, repeatability analysis under multiple splits or random seeds, institution-level transfer tests, and governance mechanisms for retrieved evidence that may become outdated or disputed. 8 Conclusion This paper presented FRAA, a retrieval-augmented model for explainable finan- cial risk assessment. FRAA combines time-aware sequence modeling, timestamp- valid knowledge retrieval, cross-attention evidence fusion, calibrated risk scoring, and explanation generation. On a large-scale proprietary multi-source dataset, FRAA achieves the lowest Log Loss and highest Recall@5 among the evalu- ated models. Ablations show that dynamic behavior, temporal encoding, and retrieval provide complementary evidence, while feature-group occlusion identi- fies knowledge-retrieved context as the strongest feature-family signal. Retrieval- depth analysis selects five documents as the best trade-off between evidence cov- erage and noise. Additional evaluations examine cross-scenario transfer, explana- tion quality, and tested latency. Taken together, the results suggest that external evidence retrieval is most valuable when it is constrained by time validity, fused with temporal user behavior, and exposed through auditable explanations. References 1. Abdou, H.A., Pointon, J.: Credit scoring, statistical techniques and evaluation criteria: A review of the literature. Intelligent Systems in Accounting, Finance and Management 18"
