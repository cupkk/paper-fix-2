                      - text: "Let D d , D s , and D m denote the dimensions of the three feature families. These vectors are concatenated and projected into a shared hidden space: x t = W p [ d t ∥ s t ∥ m t ] + b p , (1) where ∥ denotes concatenation, W p ∈ R D h × ( D d + D s + D m ) and b p ∈ R D h are trainable parameters, and x t ∈ R D h is the initial user-state representation."
