                      - text: "10 summarizes both analyses using the same values as the feature-family occlu- sion and retrieval-depth experiments. Knowledge-retrieved context produces the largest AUC drop, followed by transaction dynamics. Static profile variables still contribute, but they are less influential than time-sensitive behavioral and external-evidence signals. Retrieval depth also has a clear optimum in this set- ting: one or three documents provide insufficient external context, whereas seven or ten documents slightly degrade both metrics. We therefore use K = 5 in the main experiments. The degradation at larger K is small, but it is consistent with the retrieval-noise trade-off: broader retrieval increases coverage while introduc- ing less relevant documents into the fusion module. 0 1 2 3 4 AUC drop (%) Knowledge- retrieved Transaction dynamics Macro indicators Quasi-static profile 3.92 2.87 1.55 0.93 a 1 3 5 7 10 Retrieved documents K 0.5150 0.5175 0.5200 0.5225 0.5250 0.5275 0.5300 Log Loss selected b Log Loss Recall@5 0.4050 0.4075 0.4100 0.4125 0.4150 0.4175 0.4200 Recall@5 Fig. 3. Retrieval evidence analysis. (a) Feature-family occlusion measured by AUC drop. (b) Retrieval-depth sensitivity, with K = 5 selected for the main experiments. 4.6 Further Evaluation Explanation Quality Beyond risk scores, FRAA is intended to support human review by explaining why a high-risk case was flagged. We therefore evaluate the generated explanations using both expert ratings and lexical overlap with reference explanations."
