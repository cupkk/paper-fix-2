                    - generic [ref=e502]:
                      - text: "FRAA: A Retrieval-Augmented Agent for Explainable Financial Risk Assessment Abstract. Financial risk assessment requires calibrated predictions, timely external evidence, and explanations that can be inspected by human reviewers. Existing industrial systems often rely on manually engineered tabular features and tree ensembles, which are effective but limited in modeling long-range behavioral sequences and fast-changing market or regulatory context. This paper presents the Financial Risk Assessment Agent (FRAA), a retrieval-augmented model for explain- able financial risk assessment. For each scoring request, FRAA encodes heterogeneous user behavior with a time-aware Transformer, forms a retrieval query from the current user state, retrieves timestamp-valid documents from a financial knowledge base, fuses retrieved evidence through cross-attention, and outputs both a calibrated risk score and a concise textual justification. On a proprietary 24-month multi-source dataset with over 20 million users, 1.2 billion interactions, and 15 data sources, FRAA achieves a Log Loss of 0.5163 and Recall@5 of 0.4185, reducing Log Loss by 19.6% relative to a deployed Random Forest baseline and by 9.4% relative to a non-retrieval Transformer. Ablation studies identify knowledge retrieval as the largest contributor, while retrieval-depth analysis shows that five documents give the best trade-off between evidence coverage and noise. Additional evaluations cover cross-scenario adaptation, explanation quality rated 4.32/5 by domain experts, and 15.7 ms per-query latency under the tested serving configuration. Keywords: Financial risk assessment · Retrieval-augmented generation · Explainable AI · Risk scoring · Time-aware Transformer 1 Introduction Financial institutions assess user-level risk from heterogeneous and time-varying evidence, including transaction histories, account states, macroeconomic indica- tors, regulatory disclosures, and news sentiment. 