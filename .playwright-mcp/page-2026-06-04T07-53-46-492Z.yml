                  - generic [ref=e416]: "The offline replay in Table~\\ref{tab:business} connects calibration improvement with downstream utility under a fixed risk-appetite constraint. We report this as offline decision-support evidence, not as a claim of causal online revenue impact. The main value of this analysis is that it checks whether lower Log Loss corresponds to a practically meaningful ordering of cases under a fixed review budget."
                  - generic [ref=e419]: "\\section{Limitations and Reproducibility}"
                  - generic [ref=e422]: The evaluation uses a proprietary financial dataset that cannot be publicly released because it contains sensitive user-level risk and transaction information. This is a limitation for independent replication. To support reproducibility within this constraint, we report the data scale, feature families, chronological split, training configuration, retrieval depth, baselines, and ablation settings. The knowledge base is timestamped, and retrieval only uses documents available at or before the scoring time. These details are intended to make the experimental protocol auditable even when the raw records cannot be shared.
                  - generic [ref=e425]: Several claims should be read with this scope in mind. First, the results establish performance on one large multi-source financial environment, but not universal transfer across institutions. Second, the business-utility analysis is based on offline replay and should not be interpreted as causal online impact evidence. Third, the current evaluation does not report multi-seed variance or formal statistical significance tests, because the available audit record contains one fixed proprietary chronological split rather than repeated independent training runs. Fourth, the explanation evaluation measures expert-perceived faithfulness and readability for high-risk test predictions; it does not remove the need for human oversight in regulated decisions. Future work should add public benchmark evaluations where legally possible, repeatability analysis under multiple splits or random seeds, institution-level transfer tests, and governance mechanisms for retrieved evidence that may become outdated or disputed.
                  - generic [ref=e428]: "\\section{Conclusion}"
                  - generic [ref=e431]: This paper presented FRAA, a retrieval-augmented model for explainable financial risk assessment. FRAA combines time-aware sequence modeling, timestamp-valid knowledge retrieval, cross-attention evidence fusion, calibrated risk scoring, and explanation generation. On a large-scale proprietary multi-source dataset, FRAA achieves the best Log Loss and Recall@5 among all evaluated models. Ablations identify knowledge retrieval as the most important component, and retrieval-depth analysis selects five documents as the best trade-off between evidence coverage and noise. Additional evaluations cover cross-scenario transfer, explanation quality, and tested latency. Overall, the results indicate that external evidence retrieval is most useful when it is constrained by time validity, fused with temporal user behavior, and exposed through auditable explanations.
