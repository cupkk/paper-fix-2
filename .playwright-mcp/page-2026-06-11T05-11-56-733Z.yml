                  - generic [ref=e504] [cursor=pointer]: "FRAA: A Retrieval-Augmented Agent for Explainable Financial Risk Assessment"
                  - generic [ref=e509]: abstract
                  - generic [ref=e511]: Financial risk assessment requires probabilities that respond to changing behavior and external evidence while remaining transparent enough for human review. Many deployed systems still depend on engineered tabular features and tree ensembles. These models are effective when feature stores are stable, but they incorporate long behavioral histories and newly released market or regulatory information only indirectly. This paper presents the Financial Risk Assessment Agent (FRAA), a retrieval-augmented model that encodes time-aware user behavior, retrieves timestamp-valid financial documents, fuses the retrieved evidence through cross-attention, and returns both a calibrated risk score and a concise justification. On a proprietary 24-month dataset with over 20 million users, 1.2 billion interactions, and 15 data sources, FRAA achieves a Log Loss of 0.5163 and Recall@5 of 0.4185. This corresponds to a 19.6% Log Loss reduction relative to a deployed Random Forest baseline and a 9.4% reduction relative to a non-retrieval Transformer. Ablation and retrieval analyses indicate that timestamp-valid external evidence is the main source of improvement, with five retrieved documents giving the best balance between useful context and retrieval noise. Expert evaluation rates the generated explanations at 4.32/5 for faithfulness, and the tested serving configuration reaches 15.7 ms latency per query.
                  - generic [ref=e514]:
                    - text: "keywords:"
                    - generic [ref=e515]: Financial risk assessment \and Retrieval-augmented generation \and Explainable AI \and Risk scoring \and Time-aware Transformer
                  - generic [ref=e519]: Introduction
                  - generic [ref=e522]:
                    - text: Financial institutions assess user-level risk from evidence that is heterogeneous, time-varying, and often incomplete at the moment of decision. Such evidence includes transaction histories, account states, macroeconomic indicators, regulatory disclosures, and news sentiment. Existing risk pipelines often separate behavioral modeling, external evidence collection, and explanation generation into different stages, which makes the final decision difficult to update and audit. Reliable risk estimates support credit review and consumer lending decisions 📚
                    - generic [ref=e523]: hand1997statistical,thomas2000survey
                    - text: . They also underpin fraud prevention and compliance workflows 📚
                    - generic [ref=e524]: bolton2002statistical,ngai2011application
                    - text: . In practice, many deployed systems still use carefully engineered tabular features with tree-based models such as Random Forests 📚
                    - generic [ref=e525]: breiman2001random
                    - text: . Gradient boosting is another standard choice for tabular risk modeling 📚
                    - generic [ref=e526]: friedman2001greedy,chen2016xgboost
                    - text: . These baselines remain useful, but the central difficulty is not simply fitting a classifier. It is keeping the risk representation synchronized with behavioral changes and newly released external evidence 📚
                    - generic [ref=e527]: crook2007recent,lessmann2015benchmarking
                    - text: .
