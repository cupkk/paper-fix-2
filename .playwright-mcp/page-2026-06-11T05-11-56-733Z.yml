                      - text: "FRAA for Financial Risk Assessment 5 3.3 Time-Aware Sequence Encoding Financial behavior is observed at irregular intervals. FRAA therefore injects a time-gap encoding into each event representation. Let ∆τ i denote the elapsed time between consecutive events. The input to layer l of the Transformer encoder is updated as h ( l ) i = TransformerBlock ( l ) \x10 h ( l − 1) i + p ∆τ i \x11 , l = 1 , . . . , L, (2) where p ∆τ i is the time-gap embedding. The final state h ( L ) t summarizes the user’s observed behavior up to time t . 3.4 Retrieval-Augmented Evidence Fusion To incorporate external knowledge, FRAA converts the encoded user state into a retrieval query: q t = f q ( h ( L ) t ) , (3) where f q ( · ) is a lightweight multilayer perceptron that maps the sequence state to the document-embedding space. The financial knowledge base contains approxi- mately 1.2 million timestamped documents, including regulatory filings, market reports, news articles, and macroeconomic commentaries. Documents are em- bedded offline and indexed with FAISS. At inference time, FRAA retrieves the top- K documents by cosine similarity: D t = topK d ∈K t q ⊤ t e d ∥ q t ∥∥ e d ∥ , (4) where K t contains only documents available no later than t , and e d is the embed- ding of document d . Document embeddings are produced by a financial-domain"
