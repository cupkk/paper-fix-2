                - textbox "Visual Editor editing" [active] [ref=e2835]:
                  - generic [ref=e2836]:
                    - text: Financial institutions assess user-level risk from evidence that is heterogeneous, time-varying, and often incomplete at the moment of decision. Such evidence includes transaction histories, account states, macroeconomic indicators, regulatory disclosures, and news sentiment. Existing risk pipelines often separate behavioral modeling, external evidence collection, and explanation generation into different stages, which makes the final decision difficult to update and audit. Reliable risk estimates support credit review and consumer lending decisions 📚
                    - generic [ref=e2837]: hand1997statistical,thomas2000survey
                    - text: . They also underpin fraud prevention and compliance workflows 📚
                    - generic [ref=e2838]: bolton2002statistical,ngai2011application
                    - text: . In practice, many deployed systems still use carefully engineered tabular features with tree-based models such as Random Forests 📚
                    - generic [ref=e2839]: breiman2001random
                    - text: . Gradient boosting is another standard choice for tabular risk modeling 📚
                    - generic [ref=e2840]: friedman2001greedy,chen2016xgboost
                    - text: . These baselines remain useful, but the central difficulty is not simply fitting a classifier. It is keeping the risk representation synchronized with behavioral changes and newly released external evidence 📚
                    - generic [ref=e2841]: crook2007recent,lessmann2015benchmarking
                    - text: .
                  - generic [ref=e2347]:
                    - text: Neural sequence models offer a more flexible way to model user behavior over time, beginning with recurrent architectures such as LSTM and gated recurrent units 📚
                    - generic [ref=e2844]: hochreiter1997lstm,cho2014learning
                    - text: . Transformer encoders further improve long-range sequence modeling 📚
                    - generic [ref=e2845]: vaswani2017attention
                    - text: . Sequential recommendation work shows their value for evolving user states 📚
                    - generic [ref=e2846]: kang2018sasrec,sun2019bert4rec
                    - text: . Similar temporal modeling ideas have been used in credit-card fraud detection 📚
                    - generic [ref=e2847]: jurgovsky2018sequence
                    - text: . Yet a purely parametric sequence model remains limited in a financial risk setting. It can use market or regulatory information only if that information was encoded during training or manually attached as a feature. It also gives reviewers little direct evidence for why a high-risk case was flagged. Retrieval methods provide a way to condition decisions on external evidence available at inference time. Classical probabilistic retrieval motivates sparse evidence matching 📚
                    - generic [ref=e2848]: robertson2009probabilistic
                    - text: . Dense retrieval and RAG extend this idea to neural document representations and generation 📚
                    - generic [ref=e2849]: karpukhin2020dpr,lewis2020rag
                    - text: . Fusion-based retrieval models further show that non-parametric evidence can be integrated into downstream prediction 📚
                    - generic [ref=e2850]: izacard2021leveraging
                    - text: . In parallel, local explanation methods have shown how individual predictions can be inspected 📚
                    - generic [ref=e2851]: ribeiro2016lime,lundberg2017shap
                    - text: . Broader XAI surveys emphasize transparency as a system-level requirement 📚
                    - generic [ref=e2852]: guidotti2018survey,arrieta2020explainable
                    - text: . Calibration studies show that probability estimates require their own evaluation 📚
                    - generic [ref=e2853]: guo2017calibration,niculescu2005predicting
                    - text: . Post-hoc calibration remains relevant when raw classifier scores are not directly reliable probabilities 📚
                    - generic [ref=e2854]: zadrozny2002transforming
                    - text: . These observations motivate a risk model that retrieves time-valid financial evidence and links that evidence to both prediction and explanation.
                  - generic [ref=e2349]:
                    - text: "This work develops the {"
                    - generic [ref=e2855]: Financial Risk Assessment Agent (FRAA)
                    - text: "}, a retrieval-augmented model for explainable financial risk assessment. The word ``agent'' is used in a constrained operational sense. For each scoring request, FRAA builds a user state, queries a timestamped financial knowledge base, fuses retrieved evidence with behavioral features, estimates a risk probability, and generates a short explanation grounded in the retrieved context and influential feature groups. FRAA is therefore a structured retrieve-fuse-score-explain pipeline rather than an open-ended autonomous system."
                  - generic [ref=e2352]: "The main contributions are:"
                  - generic [ref=e2354]:
                    - text: "{\\setlength{"
                    - generic [ref=e2856]: "\\topsep}{0pt"
                    - text: "}"
                  - generic [ref=e2355]:
                    - text: "\\setlength{"
                    - generic [ref=e2857]: "\\partopsep}{0pt"
                    - text: "}"
                  - generic [ref=e2356]:
                    - text: "\\setlength{"
                    - generic [ref=e2858]: "\\itemsep}{2pt"
                    - text: "}"
                  - generic [ref=e2358]:
                    - text: "\\setlength{"
                    - generic [ref=e2859]: "\\parsep}{0pt"
                    - text: "}"
                  - generic [ref=e2360]:
                    - text: "\\vspace{"
                    - generic [ref=e2860]: "-0.8\\baselineskip"
                    - text: "}"
                  - generic [ref=e2361]: We formulate financial risk scoring as a time-constrained retrieval problem and instantiate it with FRAA, which combines temporal user encoding, timestamp-valid evidence retrieval, cross-attention fusion, and explanation generation.
                  - generic [ref=e2362]: We evaluate FRAA on a large-scale proprietary multi-source dataset with a strict chronological split, and compare it with deployed tree-based baselines and neural sequence models.
                  - generic [ref=e2363]: We report component ablations, feature-group occlusion, retrieval-depth analysis, explanation quality assessment, and latency measurements to examine the contribution and operational cost of the retrieval and explanation components.
                  - generic [ref=e2366]: "}"
                  - generic [ref=e2369]: Related Work
                  - generic [ref=e2371]: Financial Risk Modeling and Tabular Baselines
                  - generic [ref=e2373]:
                    - text: Classical credit-risk systems are built around statistical classifiers, scorecards, and tree ensembles, which remain strong baselines for heterogeneous tabular data 📚
                    - generic [ref=e2861]: hand1997statistical,thomas2000survey
                    - text: . Benchmarking and survey studies show that this pattern holds across credit-scoring datasets, classifier families, and operational fraud settings 📚
                    - generic [ref=e2862]: baesens2003benchmarking,abdou2011credit
                    - text: . Later reviews further document the breadth of classification methods used in financial risk modeling 📚
                    - generic [ref=e2863]: louzada2016classification
                    - text: . In practice, Random Forests, gradient boosting, and XGBoost remain difficult baselines to displace because they fit mixed tabular features well 📚
                    - generic [ref=e2864]: breiman2001random,friedman2001greedy
                    - text: . This is also confirmed by large benchmark comparisons of credit-scoring algorithms 📚
                    - generic [ref=e2865]: chen2016xgboost,lessmann2015benchmarking
                    - text: . Credit and fraud datasets are often imbalanced and loss-asymmetric, so ranking quality and calibration matter alongside raw accuracy 📚
                    - generic [ref=e2866]: crook2007recent,brown2012experimental
                    - text: . Studies of consumer-credit and fraud investigation systems make the same point in realistic review workflows 📚
                    - generic [ref=e2867]: khandani2010consumer,bellotti2009support
                    - text: . Fraud-detection surveys connect these models to monitoring and compliance settings 📚
                    - generic [ref=e2868]: bolton2002statistical,ngai2011application
                    - text: ". Their strength, however, also defines the boundary of this paradigm: the model state is largely determined by engineered feature stores, while newly emerging market or regulatory evidence must be manually transformed before it can affect a decision."
                  - generic [ref=e2376]: Sequential User Modeling
                  - generic [ref=e2377]:
                    - text: Sequential recommendation and behavior modeling show that recurrent networks can capture evolving user states 📚
                    - generic [ref=e2869]: hochreiter1997lstm,cho2014learning
                    - text: . Transformer encoders extend this capacity with attention-based long-range dependencies 📚
                    - generic [ref=e2870]: vaswani2017attention
                    - text: . SASRec and BERT4Rec then demonstrate the value of self-attention for sequential user modeling in recommendation tasks 📚
                    - generic [ref=e2871]: kang2018sasrec,sun2019bert4rec
