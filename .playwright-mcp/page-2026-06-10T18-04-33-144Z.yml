                    - generic [ref=e2885]:
                      - text: "FRAA: A Retrieval-Augmented Agent for Explainable Financial Risk Assessment Abstract. Financial risk assessment requires probabilities that respond to changing behavior and external evidence while remaining transpar- ent enough for human review. Many deployed systems still depend on engineered tabular features and tree ensembles. These models are ef- fective when feature stores are stable, but they incorporate long be- havioral histories and newly released market or regulatory information only indirectly. This paper presents the Financial Risk Assessment Agent (FRAA), a retrieval-augmented model that encodes time-aware user be- havior, retrieves timestamp-valid financial documents, fuses the retrieved evidence through cross-attention, and returns both a calibrated risk score and a concise justification. On a proprietary 24-month dataset with over 20 million users, 1.2 billion interactions, and 15 data sources, FRAA achieves a Log Loss of 0.5163 and Recall@5 of 0.4185. This corresponds to a 19.6% Log Loss reduction relative to a deployed Random Forest baseline and a 9.4% reduction relative to a non-retrieval Transformer. Ablation and retrieval analyses indicate that timestamp-valid external evidence is the main source of improvement, with five retrieved docu- ments giving the best balance between useful context and retrieval noise. Expert evaluation rates the generated explanations at 4.32/5 for faith- fulness, and the tested serving configuration reaches 15.7 ms latency per query. Keywords: Financial risk assessment · Retrieval-augmented generation · Explainable AI · Risk scoring · Time-aware Transformer 1 Introduction Financial institutions assess user-level risk from evidence that is heterogeneous, time-varying, and often incomplete at the moment of decision. Such evidence includes transaction histories, account states, macroeconomic indicators, regu- latory disclosures, and news sentiment. Existing risk pipelines often separate behavioral modeling, external evidence collection, and explanation generation into different stages, which makes the final decision difficult to update and au-"
