                  - generic [ref=e662] [cursor=pointer]: ▾
                - textbox "Source Editor editing" [ref=e404]:
                  - generic [ref=e666]: "\\textsc{Fiscal} is evaluated on financial risk benchmarks with heterogeneous access constraints. The FinStress and CreditRisk settings include internal or licensed sources, so exact public reproduction may require institutionally available analogues. The explanation analysis is based on a limited manually inspected subset, and the current study uses fixed memory banks rather than online memory updates. These limitations do not change the reported benchmark comparisons, but they delimit the claims to offline risk classification and retrieval-grounded explanation under the evaluated data conditions."
                  - generic [ref=e669]: "\\section{Conclusion}"
                  - generic [ref=e670]: "\\label{sec:conclusion}"
                  - generic [ref=e673]: "We introduced \\textsc{Fiscal}, a multi-agent method for real-time financial risk surveillance under heterogeneous, partially missing multimodal data and strict latency constraints. The model couples volatility-weighted symbolic tokenization with extreme-event symbols, risk-modulated sparse attention, retrieval-augmented case memory, and explainable mixture-of-experts routing, allowing computation and reasoning to adapt to the current risk level while predictions remain linked to historical precedents."
                  - generic [ref=e676]:
                    - text: "Experiments on three financial benchmarks (\\textsc{FinStress}, \\textsc{FraudDetect"
                    - generic [ref=e677]: "},"
                    - text: "and \\textsc{CreditRisk}) show that \\textsc{Fiscal} exceeds the best-performing baseline by 2.8--4.5 percentage points in macro-F1 and by 1.8--2.3 percentage points in AUC under full modality availability. The advantage grows under missing-data conditions: at 40\\% modality dropout, \\textsc{Fiscal} retains 92--94\\% of its clean-data performance and widens the relative margin over the next-best baseline to 9--14\\% F1. Ablation studies identify retrieval-augmented memory and volatility-weighted tokenization as the largest contributors, while the risk-modulated attention budget reduces GMACs by 31\\% and inference latency by 28\\% compared with a fully dense cross-modal transformer. The model also remains resilient to input noise and compensates for missing weaker modalities, as shown by the modality analysis on fraud detection."
                  - generic [ref=e680]: "\\textsc{Fiscal} brings together multimodal fusion, adaptive resource allocation, and analyst-facing explanations anchored in retrieved historical cases. Future work will extend the method to online continual learning, where the retrieval memory is incrementally updated, and to cross-market transfer scenarios in which risk patterns learned in one jurisdiction are adapted to another with minimal fine-tuning."
