                    - generic [ref=e707]: "FISCAL for Financial Risk Surveillance 7 Inside the encoder, for a given query q ∈ Q j we sample a random key set K ′ of size u j i log L K j and evaluate P ( q , K ′ ) = max k ∈ K ′ a qk − 1 | K ′ | X k ∈ K ′ a qk , a qk = qk ⊤ √ d . (6) Here L K j and L Q j denote the key and query sequence lengths for modality j . Only the top υ j i = u j i log L Q j queries are retained per head, and the attention output is ¯ s j = Softmax \x12 ¯ Q j ( K j ) ⊤ √ d \x13 V j , (7) where ¯ Q j contains the selected queries. A standard residual connection and 1D-convolutional distillation (with leaky ReLU activation for gradient flow) are applied to obtain the final intra-modal embedding z j i ∈ R d j × L j . 3.4 Multi-Agent Collaboration with Retrieval-Augmented Memory Agent Roles and Communication Backbone The multi-agent module contains three specialist agents. The Monitor Agent A mon assesses risk levels from raw data and updates attention budgets by producing r i . The Analyst Agent A ana interprets the multimodal context by attending over tokenized summaries and the retrieval memory. The Decision Agent A dec produces the final risk prediction and an explanation anchored in retrieved precedents. Agents communicate through a shared sparse cross-modal attention canvas (the multimodal sequence c i , analogous to concatenation) and via dedicated message vectors. These messages are learned vector states rather than free-form text: the monitor message contains the modality risk scores and availability mask, the analyst message summarizes the attended multimodal context, and the decision message concatenates the analyst state with retrieved-case evidence before routing. We form the multimodal sequence from the intra-modal encodings after adding learned modality and temporal position embeddings: ˆ z j i = z j i + E j mod + P j time , c i = [ˆ z 1 i ∥ ˆ z 2 i ∥ . . . ∥ ˆ z M i ] ∈ R d × L tot . (8) where ∥ denotes temporal concatenation. Sparse