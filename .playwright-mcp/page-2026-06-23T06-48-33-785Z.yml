                - textbox "Source Editor editing" [ref=e582]:
                  - generic [ref=e920]: "We next examine two complementary views: feature-family occlusion and retrieval depth. Figure~\\ref{fig:retrieval_depth} summarizes both analyses. Knowledge-retrieved context produces the largest AUC drop, followed by transaction dynamics; static profile variables still contribute, but less than time-sensitive behavioral and external-evidence signals. Retrieval depth also has a clear optimum: one or three documents provide insufficient context, whereas seven or ten slightly degrade both metrics. We therefore use $K=5$ in the main experiments."
                  - generic [ref=e923]: "\\begin{figure}[!h]"
                  - generic [ref=e924]: \centering
                  - generic [ref=e925]: "\\includegraphics[width=0.92\\textwidth]{retrieval_depth_sensitivity.pdf}"
                  - generic [ref=e926]: "\\caption{Retrieval evidence analysis. (a) Feature-family occlusion measured by AUC drop. (b) Retrieval-depth sensitivity, with $K=5$ selected for the main experiments.}"
                  - generic [ref=e927]: "\\label{fig:retrieval_depth}"
                  - generic [ref=e928]: "\\end{figure}"
                  - generic [ref=e931]: The reverse feature-addition check leads to the same interpretation. Knowledge-retrieved context alone is useful, transaction dynamics gives the sharpest single improvement, and the complete feature set performs best. This supports combining external evidence with dynamic behavior rather than relying on either signal family alone.
                  - generic [ref=e934]: "\\subsection{Explanation and Efficiency Analysis}"
                  - generic [ref=e937]: "\\subsubsection{Explanation Quality}"
                  - generic [ref=e938]: Beyond risk scores, FRAA is intended to support human review by explaining why a high-risk case was flagged. We evaluate the generated explanations using expert ratings and lexical overlap with reference explanations.
                  - generic [ref=e941]: "\\begin{figure}[!h]"
                  - generic [ref=e942]: \centering
                  - generic [ref=e943]: "\\includegraphics[width=0.92\\textwidth]{explanation_quality_evaluation.pdf}"
                  - generic [ref=e944]: "\\caption{Explanation-quality evaluation. (a) Expert-rated faithfulness and readability on a five-point scale. (b) ROUGE-L overlap with reference explanations.}"
                  - generic [ref=e945]: "\\label{fig:explanation_quality}"
                  - generic [ref=e946]: "\\end{figure}"
                  - generic [ref=e949]: "Five domain experts evaluated 1,000 high-risk test predictions. Figure~\\ref{fig:explanation_quality} shows that FRAA improves faithfulness, readability, and ROUGE-L over a template baseline that lists the top three feature groups. The full model obtains faithfulness of 4.32/5, readability of 4.51/5, and ROUGE-L of 0.4131. These ratings indicate auditability, not that generated text is sufficient for automatic decision making."
                  - generic [ref=e952]: "\\subsubsection{Efficiency Analysis}"
                  - generic [ref=e953]: "The final evaluation asks whether retrieval and fusion are practical for analyst-facing review. Table~\\ref{tab:latency} reports mean per-query latency and throughput under the same batch-size-64 serving configuration."
                  - generic [ref=e956]: "\\begin{table}[H]"
                  - generic [ref=e957]: \centering
                  - generic [ref=e958]: \scriptsize
                  - generic [ref=e959]: "\\caption{Inference latency and throughput comparison under batch size 64.}"
                  - generic [ref=e960]: "\\label{tab:latency}"
                  - generic [ref=e961]: "\\begin{tabular}{lcc}"
                  - generic [ref=e962]: \toprule
                  - generic [ref=e963]: "\\textbf{Model} & \\textbf{Latency (ms/query)} & \\textbf{Throughput (queries/s)} \\\\"
                  - generic [ref=e964]: \midrule
                  - generic [ref=e965]: RF + KB features & 1.9 & 12,530 \\
                  - generic [ref=e966]: "\\rowcolor{tablerowalt}"
                  - generic [ref=e967]: XGBoost & 2.1 & 11,200 \\
                  - generic [ref=e968]: LSTM & 8.3 & 5,910 \\
                  - generic [ref=e969]: "\\rowcolor{tablerowalt}"
                  - generic [ref=e970]: Transformer & 12.4 & 4,320 \\
                  - generic [ref=e971]: "\\textbf{FRAA (full)} & 15.7 & 4,070 \\\\"
                  - generic [ref=e972]: \bottomrule
                  - generic [ref=e973]: "\\end{tabular}"
                  - generic [ref=e974]: "\\end{table}"
                  - generic [ref=e977]: "FRAA is slower than tabular baselines because it performs retrieval and neural sequence encoding, but the tested latency remains compatible with interactive review: the full model requires 15.7 ms/query and reaches 4,070 queries/s. Retrieval accounts for approximately 4.2 ms of the total latency. Throughput remains sufficient for batched offline scoring and analyst triage in the tested configuration."
                  - generic [ref=e980]: "\\subsection{Limitations and Reproducibility}"
                  - generic [ref=e981]: The main reproducibility risk is external validation under distribution shift rather than the scoring protocol itself. To make the protocol auditable, we specify the 30-day prediction horizon, strict chronological split, validation-month hyperparameter selection, 120-day behavioral window, timestamp-filtered retrieval, fixed retrieval depth ($K=5$), and the evaluation metrics used for calibration and ranking. No test-set labels are used for checkpoint selection, and retrieval candidates are filtered by timestamp at scoring time. Future work should add repeated temporal splits, multi-seed training runs, and institution-level transfer tests to quantify stability under distribution shift.
                  - generic [ref=e984]: "\\section{Conclusion}"
                  - generic [ref=e987]: This paper presented FRAA, a retrieval-augmented model for explainable financial risk assessment. On a large-scale proprietary multi-source dataset, FRAA achieves the best Log Loss and Recall@5 among the evaluated models. The ablation and retrieval-depth analyses suggest that external evidence is most useful when retrieval is constrained by decision time and fused with temporal user behavior. The explanation and latency results further indicate that the model can support analyst-facing review under the tested serving configuration. Future work should test repeated temporal splits, multi-seed training runs, and institution-level transfer to quantify stability under distribution shift. Overall, FRAA shows that time-valid retrieval can improve risk scoring when it is tied to both calibrated prediction and auditable explanation.
