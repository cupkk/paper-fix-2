                      - text: "FRAA: A Retrieval-Augmented Agent for Explainable Financial Risk Assessment Abstract. Financial risk assessment requires probabilities that respond to changing behavior and external evidence while remaining transpar- ent enough for human review. Many deployed systems still depend on engineered tabular features and tree ensembles. These models are ef- fective when feature stores are stable, but they incorporate long be- havioral histories and newly released market or regulatory information only indirectly. This paper presents the Financial Risk Assessment Agent (FRAA), a retrieval-augmented model for explainable financial risk scor- ing. FRAA encodes time-aware user behavior, retrieves timestamp-valid financial documents, fuses the retrieved evidence through cross-attention, and returns both a calibrated risk score and a concise justification. We evaluate FRAA on a proprietary 24-month dataset with over 20 million users, 1.2 billion interactions, and 15 data sources. FRAA achieves a Log Loss of 0.5163 and Recall@5 of 0.4185. This corresponds to a 19.6% Log Loss reduction relative to a deployed Random Forest baseline and a 9.4% reduction relative to a non-retrieval Transformer. Ablation and retrieval-depth analyses indicate that timestamp-valid external evidence is the main source of improvement. Expert evaluation rates the generated explanations at 4.32/5 for faithfulness, and the tested serving configura- tion reaches 15.7 ms latency per query. Keywords: Financial risk assessment · Retrieval-augmented generation · Explainable AI · Risk scoring · Time-aware Transformer 1 Introduction Financial institutions assess user-level risk from evidence that is heterogeneous, time-varying, and often incomplete at the moment of decision. Such evidence includes transaction histories, account states, macroeconomic indicators, regu- latory disclosures, and news sentiment. Existing risk pipelines often separate behavioral modeling, external evidence collection, and explanation generation into different stages, which makes the final decision difficult to update and au-"
                      - generic [ref=e922]:
                        - text: dit. Reliable risk estimates support credit review and consumer lending decisions
                        - link [ref=e923] [cursor=pointer]:
