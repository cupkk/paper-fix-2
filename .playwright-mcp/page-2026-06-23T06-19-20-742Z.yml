                      - text: "12 Table 4. Inference latency and throughput comparison under batch size 64. Model Latency (ms/query) Throughput (queries/s) RF + KB features 1.9 12,530 XGBoost 2.1 11,200 LSTM 8.3 5,910 Transformer 12.4 4,320 FRAA (full) 15.7 4,070 FRAA is slower than tabular baselines because it performs retrieval and neu- ral sequence encoding, but the tested latency remains compatible with interac- tive review: the full model requires 15.7 ms/query and reaches 4,070 queries/s. Retrieval accounts for approximately 4.2 ms of the total latency. Throughput remains sufficient for batched offline scoring and analyst triage in the tested configuration. 4.8 Limitations and Reproducibility The main reproducibility risk is external validation under distribution shift rather than the scoring protocol itself. To make the protocol auditable, we spec- ify the 30-day prediction horizon, strict chronological split, validation-month hy- perparameter selection, 120-day behavioral window, timestamp-filtered retrieval, fixed retrieval depth ( K = 5 ), and the evaluation metrics used for calibration and ranking. No test-set labels are used for checkpoint selection, and retrieval candidates are filtered by timestamp at scoring time. Future work should add repeated temporal splits, multi-seed training runs, and institution-level transfer tests to quantify stability under distribution shift. 5 Conclusion This paper presented FRAA, a retrieval-augmented model for explainable finan- cial risk assessment. On a large-scale proprietary multi-source dataset, FRAA achieves the best Log Loss and Recall@5 among the evaluated models. The ab- lation and retrieval-depth analyses suggest that external evidence is most useful when retrieval is constrained by decision time and fused with temporal user behavior. The explanation and latency results further indicate that the model can support analyst-facing review under the tested serving configuration. Fu- ture work should test repeated temporal splits, multi-seed training runs, and institution-level transfer to quantify stability under distribution shift. Overall, FRAA shows that time-valid retrieval can improve risk scoring when it is tied to both calibrated prediction and auditable explanation. References 1. Abdou, H.A., Pointon, J.: Credit scoring, statistical techniques and evaluation criteria: A review of the literature. Intelligent Systems in Accounting, Finance and Management 18"
