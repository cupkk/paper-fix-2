                      - text: "lines of work point to the same requirement: a risk model should expose not only a probability, but also the evidence used to support it. 3 Methodology 3.1 Problem Formulation For a user u and decision time t , the task is to estimate the probability ˆ r t ∈ [0 , 1] that a material adverse event will occur within the next 30 days. The label y t ∈ { 0 , 1 } indicates whether such an event is observed. The model receives a time-ordered window of behavioral, profile, macroeconomic, and external- document signals available no later than t . This chronological constraint is ap- plied throughout training and testing to avoid future information leakage. Each training instance is built from an observation window ending at t and a prediction window that immediately follows it. Dynamic events after t are excluded. Slowly changing attributes are read from the latest snapshot available before t . External documents follow the same rule: a document can be retrieved only if its publication or ingestion timestamp is no later than the scoring time. This setup reflects operational risk review, where decisions are made before the adverse event and before later market information becomes available. 3.2 Multi-Source State Construction FRAA maps the available evidence into three feature families. The dynamic transactional context d t ∈ R D d summarizes recent transaction amount, fre- quency, volatility, merchant category, and event timing. The quasi-static profile context s t ∈ R D s contains slowly changing user attributes, including account tenure, product holdings, balance ranges, and risk tier. The market and macro context m t ∈ R D m contains time-aligned external indicators available before the scoring time. The external-document branch is motivated by evidence that news"
                      - generic [ref=e634]:
                        - text: and regulatory language can carry risk-relevant signals [37,27].
                        - link [ref=e635] [cursor=pointer]:
                          - /url: "#cite.tetlock2007giving"
                        - link [ref=e636] [cursor=pointer]:
                          - /url: "#cite.loughran2011liability"
                      - text: "Let D d , D s , and D m denote the dimensions of the three feature families. These vectors are concatenated and projected into a shared hidden space: x t = W p [ d t ∥ s t ∥ m t ] + b p , (1) where ∥ denotes concatenation, W p ∈ R D h × ( D d + D s + D m ) and b p ∈ R D h are trainable parameters, and x t ∈ R D h is the initial user-state representation."
                  - generic "Page ⁨5⁩" [ref=e648]:
                    - generic [ref=e650]:
                      - text: "FRAA for Financial Risk Assessment 5 3.3 Time-Aware Sequence Encoding Financial behavior is observed at irregular intervals. FRAA therefore injects a time-gap encoding into each event representation. Let ∆τ i denote the elapsed time between consecutive events. The input to layer l of the Transformer encoder is updated as h ( l ) i = TransformerBlock ( l ) \x10 h ( l − 1) i + p ∆τ i \x11 , l = 1 , . . . , L, (2) where p ∆τ i is the time-gap embedding. The final state h ( L ) t summarizes the user’s observed behavior up to time t . 3.4 Retrieval-Augmented Evidence Fusion To incorporate external knowledge, FRAA converts the encoded user state into a retrieval query: q t = f q ( h ( L ) t ) , (3) where f q ( · ) is a lightweight multilayer perceptron that maps the sequence state to the document-embedding space. The financial knowledge base contains approxi- mately 1.2 million timestamped documents, including regulatory filings, market reports, news articles, and macroeconomic commentaries. Documents are em- bedded offline and indexed with FAISS. At inference time, FRAA retrieves the top- K documents by cosine similarity: D t = topK d ∈K t q ⊤ t e d ∥ q t ∥∥ e d ∥ , (4) where K t contains only documents available no later than t , and e d is the embed- ding of document d . Document embeddings are produced by a financial-domain"
                      - generic [ref=e651]:
