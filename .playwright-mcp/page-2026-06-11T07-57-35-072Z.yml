                  - generic [ref=e502]: Further Evaluation
                  - generic [ref=e505]: Explanation Quality
                  - generic [ref=e506]: Beyond risk scores, FRAA is intended to support human review by explaining why a high-risk case was flagged. The goal is not to automate the final decision, but to make the model output easier to inspect. We therefore evaluate the generated explanations using both expert ratings and lexical overlap with reference explanations.
                  - button "Edit figure" [ref=e512] [cursor=pointer]:
                    - generic [ref=e514]: edit
                  - generic [ref=e516]: Explanation-quality evaluation. (a) Expert-rated faithfulness and readability on a five-point scale. (b) ROUGE-L overlap with reference explanations.
                  - generic [ref=e518]: 🏷fig:explanation_quality
                  - generic [ref=e523]:
                    - text: Five domain experts evaluated 1,000 high-risk test predictions. Figure 🏷
                    - generic [ref=e524]: fig:explanation_quality
                    - text: reports higher faithfulness, readability, and ROUGE-L for FRAA than for a template baseline that lists the top three feature groups. The full model obtains faithfulness of 4.32/5, readability of 4.51/5, and ROUGE-L of 0.4131. The result suggests that the explanation head adds information beyond feature enumeration. The expert ratings should be interpreted as an auditability signal, not as evidence that generated text is sufficient for automatic decision making.
                  - generic [ref=e527]: Efficiency Analysis
                  - generic [ref=e528]: The final evaluation asks whether the added retrieval and fusion steps are practical for an analyst-facing review loop.
                  - generic [ref=e531]: "FRAA is slower than tree ensembles because it performs retrieval and neural sequence encoding. Even so, the tested latency remains compatible with interactive risk review: FRAA requires 15.7 ms per query and reaches 4,070 queries/s in the batch-size-64 serving configuration. The retrieval step accounts for approximately 4.2 ms of the total latency. Throughput is lower than for tabular baselines, but remains above the level required for batched offline scoring and analyst triage in the tested configuration."
                  - generic [ref=e534]: Conclusion
                  - generic [ref=e537]:
                    - text: This paper presented FRAA, a retrieval-augmented model for explainable financial risk assessment. The main finding is that retrieval helps risk scoring most when external evidence is time-valid and fused with temporal user behavior, rather than attached as a static feature. On a large-scale proprietary multi-source dataset, FRAA obtains the lowest Log Loss and highest Recall@5 among the evaluated models. The ablation, occlusion, and retrieval-depth analyses trace the gains mainly to timestamp-valid external evidence, with five retrieved documents giving the best trade-off between evidence coverage and noise. Explanation and latency evaluations further indicate that the model can support analyst-facing review under the tested serving configuration. The evaluation is limited to one proprietary financial environment, so future work should add public benchmark evaluations where legally possible, repeatability analysis under multiple splits or random seeds, and institution-level transfer tests including parameter-efficient adaptation methods such as LoRA 📚
                    - generic [ref=e538]: hu2022lora
                    - text: . Taken together, the results suggest that external evidence retrieval is most valuable when it is constrained by time validity, fused with temporal user behavior, and exposed through auditable explanations.
