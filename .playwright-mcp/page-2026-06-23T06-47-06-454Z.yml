                      - text: "lines of work point to the same requirement: a risk model should expose not only a probability, but also the evidence used to support it. 3 Method 3.1 Problem Formulation For a user u and decision time t , the task is to estimate the probability ˆ r t ∈ [0 , 1] that a material adverse event will occur within the next 30 days. The label y t ∈ { 0 , 1 } indicates whether such an event is observed. The model receives a time-ordered window of behavioral, profile, macroeconomic, and external- document signals available no later than t . This chronological constraint is ap- plied throughout training and testing to avoid future information leakage. Each training instance is built from an observation window ending at t and a prediction window that immediately follows it. Dynamic events after t are excluded. Slowly changing attributes are read from the latest snapshot available before t . External documents follow the same rule: a document can be retrieved only if its publication or ingestion timestamp is no later than the scoring time. This setup reflects operational risk review, where decisions are made before the adverse event and before later market information becomes available. 3.2 Multi-Source State Construction FRAA maps the available evidence into three feature families. The dynamic transactional context d t ∈ R D d summarizes recent transaction amount, fre- quency, volatility, merchant category, and event timing. The quasi-static profile context s t ∈ R D s contains slowly changing user attributes, including account tenure, product holdings, balance ranges, and risk tier. The market and macro context m t ∈ R D m contains time-aligned external indicators available before the scoring time. The external-document branch is motivated by evidence that news"
                      - generic [ref=e841]:
                        - text: and regulatory language can carry risk-relevant signals [37,27].
