                      - text: "reliable probabilities [40]. These observations motivate a risk model that re- trieves time-valid financial evidence and links that evidence to both prediction and explanation. This work develops the Financial Risk Assessment Agent (FRAA) , a retrieval-augmented model for explainable financial risk assessment. The word “agent” is used in a constrained operational sense. For each scoring request, FRAA builds a user state, queries a timestamped financial knowledge base, fuses retrieved evidence with behavioral features, estimates a risk probability, and generates a short explanation grounded in the retrieved context and influ- ential feature groups. FRAA is therefore a structured retrieve-fuse-score-explain pipeline rather than an open-ended autonomous system. The main contributions are: — We formulate financial risk scoring as a time-constrained retrieval prob- lem and instantiate it with FRAA, which combines temporal user encoding, timestamp-valid evidence retrieval, cross-attention fusion, and explanation generation. — We evaluate FRAA on a large-scale proprietary multi-source dataset with a strict chronological split, and compare it with deployed tree-based baselines and neural sequence models. — We analyze the retrieval, temporal, and explanation components through ablation, retrieval-depth, explanation-quality, and latency studies."
