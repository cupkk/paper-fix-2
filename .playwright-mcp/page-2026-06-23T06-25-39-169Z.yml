                      - text: "alizes the two primary metrics. The ordering is consistent across calibration and ranking: the full retrieval-augmented model outperforms tree-based baselines, the non-retrieval Transformer, and all ablated FRAA variants. Table 1. Main test-set performance. Lower Log Loss and higher Recall@5 are better. Model Log Loss Recall@5 RF (deployed baseline) 0.6421 0.3172 RF + KB features 0.6289 0.3291 XGBoost 0.6104 0.3495 LSTM 0.5873 0.3738 Transformer 0.5698 0.3846 FRAA (-Dyn) 0.5642 0.3891 FRAA (-TE) 0.5510 0.3957 FRAA (-KB) 0.5385 0.4023 FRAA (full) 0.5163 0.4185 Relative to the deployed RF baseline, FRAA reduces Log Loss by 19.6% and raises Recall@5 from 0.3172 to 0.4185. Relative to the non-retrieval Transformer, it reduces Log Loss by 9.4% and raises Recall@5 by 8.8%. The ablated variants remain below the full model, indicating that retrieval, temporal encoding, and dynamic features contribute complementary information."
