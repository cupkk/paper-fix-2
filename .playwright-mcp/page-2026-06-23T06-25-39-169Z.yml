                      - text: "[3,8]. We also include a neural tabular reference point because recent tabular"
                      - generic [ref=e1401]:
                        - text: deep learning remains competitive only under careful benchmarking [2]. All
                        - link [ref=e1402] [cursor=pointer]:
                          - /url: "#cite.arik2021tabnet"
                      - text: baselines use the same chronological split and available feature families. FRAA is implemented in PyTorch and trained with AdamW, learning rate 1 × 10 − 4 , weight decay 1 × 10 − 5 , batch size 64, and a maximum budget of 50 epochs. The checkpoint is selected by validation Log Loss, and no test-set information is used for model selection. Hyperparameters are chosen on the validation month and then fixed for the test month. For retrieval variants, document embeddings are constructed offline and indexed before evaluation. During scoring, the retrieval pool is filtered by timestamp before nearest-neighbor search. This step is essential because a high- capacity retrieval model could otherwise use documents that were unavailable when the decision should have been made.
