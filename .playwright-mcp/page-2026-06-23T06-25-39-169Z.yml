                      - text: 8 4.3 Evaluation Questions The experiments address three questions. First, does retrieval-augmented evi- dence improve calibrated risk prediction and high-risk ranking relative to tree- based and neural baselines? Second, which temporal, feature, and retrieval com- ponents account for the observed gains? Third, are the explanations and la- tency compatible with analyst-facing risk review? The following sections follow this order, separating predictive performance, ablation evidence, and operational evaluation. 4.4 Main Results
