                      - text: "lines of work point to the same requirement: a risk model should expose not only a probability, but also the evidence used to support it. 3 Method 3.1 Problem Formulation For a user u and decision time t , the task is to estimate the probability ˆ r t ∈ [0 , 1] that a material adverse event will occur within the next 30 days. The label y t ∈ { 0 , 1 } indicates whether such an event is observed. The model receives a time-ordered window of behavioral, profile, macroeconomic, and external- document signals available no later than t . This chronological constraint is ap- plied throughout training and testing to avoid future information leakage. Each training instance is built from an observation window ending at t and a prediction window that immediately follows it. Dynamic events after t are excluded. Slowly changing attributes are read from the latest snapshot available before t . External documents follow the same rule: a document can be retrieved only if its publication or ingestion timestamp is no later than the scoring time. This setup reflects operational risk review, where decisions are made before the adverse event and before later market information becomes available. 3.2 Multi-Source State Construction FRAA maps the available evidence into three feature families. The dynamic transactional context d t ∈ R D d summarizes recent transaction amount, fre- quency, volatility, merchant category, and event timing. The quasi-static profile context s t ∈ R D s contains slowly changing user attributes, including account tenure, product holdings, balance ranges, and risk tier. The market and macro context m t ∈ R D m contains time-aligned external indicators available before the scoring time. The external-document branch is motivated by evidence that news"
                      - generic [ref=e1367]:
                        - text: and regulatory language can carry risk-relevant signals [37,27].
                        - link [ref=e1368] [cursor=pointer]:
                          - /url: "#cite.tetlock2007giving"
                        - link [ref=e1369] [cursor=pointer]:
                          - /url: "#cite.loughran2011liability"
                      - text: "Let D d , D s , and D m denote the dimensions of the three feature families. These vectors are concatenated and projected into a shared hidden space: x t = W p [ d t ∥ s t ∥ m t ] + b p , (1) where ∥ denotes concatenation, W p ∈ R D h × ( D d + D s + D m ) and b p ∈ R D h are trainable parameters, and x t ∈ R D h is the initial user-state representation."
                  - generic "Page ⁨5⁩" [ref=e1381]:
                    - generic [ref=e1383]:
                      - text: "FRAA for Financial Risk Assessment 5 3.3 Time-Aware Sequence Encoding Financial behavior is observed at irregular intervals. FRAA therefore injects a time-gap encoding into each event representation. Let ∆τ i denote the elapsed time between consecutive events. The input to layer l of the Transformer encoder is updated as h ( l ) i = TransformerBlock ( l ) \x10 h ( l − 1) i + p ∆τ i \x11 , l = 1 , . . . , L, (2) where p ∆τ i is the time-gap embedding. The final state h ( L ) t summarizes the user’s observed behavior up to time t . 3.4 Retrieval-Augmented Evidence Fusion To incorporate external knowledge, FRAA converts the encoded user state into a retrieval query: q t = f q ( h ( L ) t ) , (3) where f q ( · ) is a lightweight multilayer perceptron that maps the sequence state to the document-embedding space. The financial knowledge base contains approxi- mately 1.2 million timestamped documents, including regulatory filings, market reports, news articles, and macroeconomic commentaries. Documents are em- bedded offline and indexed with FAISS. At inference time, FRAA retrieves the top- K documents by cosine similarity: D t = topK d ∈K t q ⊤ t e d ∥ q t ∥∥ e d ∥ , (4) where K t contains only documents available no later than t , and e d is the embed- ding of document d . Document embeddings are produced by a financial-domain"
                      - generic [ref=e1384]:
                        - text: text encoder initialized from bidirectional Transformer encoders and sentence-
                        - link [ref=e1385] [cursor=pointer]:
                          - /url: "#cite.devlin2019bert"
                        - link [ref=e1386] [cursor=pointer]:
                          - /url: "#cite.reimers2019sentence"
                      - text: "level retrieval models [12,33]. The timestamp restriction prevents future docu- ments from leaking into the prediction. The retrieved document embeddings are fused with the user state using cross- attention: ˜ h t = CrossAttn \x10 h ( L ) t W Q , D t W K , D t W V \x11 , (5) where D t ∈ R K × D e stacks the embeddings of retrieved documents, D e is the document-embedding dimension, and W Q , W K , and W V are trainable projec- tion matrices. The fused representation ˜ h t is passed to the scoring and explana- tion heads. Cross-attention is used instead of simple concatenation because the relevance of external evidence depends on the user state. For example, a macroe- conomic commentary may matter for users with concentrated sector exposure, but may be weakly relevant for users whose recent transactions do not involve that sector."
                  - generic "Page ⁨6⁩" [ref=e1389]:
                    - generic [ref=e1391]:
                      - text: "6 3.5 Risk Scoring and Explanation Generation The risk head maps the fused representation to a calibrated probability: ˆ r t = σ ( w ⊤ r ˜ h t + b r ) . (6) where σ ( · ) is the sigmoid function, w r is a trainable risk-head vector, and b r is a scalar bias. In parallel, a supervised explanation decoder generates a concise textual justification from the retrieved documents and feature-group importance signals. The training objective combines per-instance binary cross-entropy for risk prediction with an explanation-fidelity term: L = − y t log ˆ r t − (1 − y t ) log(1 − ˆ r t ) + λ L exp (ˆ e t , e ref t ) , (7) where ˆ e t is the generated explanation, e ref t is an expert or rule-supported reference explanation, L exp penalizes mismatches with reference evidence and feature-group rationales, and λ balances prediction and explanation supervision. The reference explanation is constructed from analyst-approved risk factors and timestamp-valid evidence snippets, so the explanation loss encourages the decoder to mention evidence that was actually available at the scoring time. In all reported experiments, the Transformer uses 8 attention blocks, hidden dimension 256, and embedding dimension 512. Retrieval depth is K = 5 unless otherwise stated. Fig. 1. Overview of FRAA. The model encodes multi-source financial behavior, re- trieves timestamp-valid documents from a financial knowledge base, fuses retrieved evidence with the user state, and outputs both a calibrated risk score and an explana-"
                      - generic [ref=e1392]:
                        - text: tion.
                        - link [ref=e1393] [cursor=pointer]:
                          - /url: "#figure.1"
                      - text: Figure 1 summarizes the inference path from multi-source evidence encoding to retrieval, fusion, scoring, and explanation generation. 4 Experiments 4.1 Dataset and Evaluation Protocol The dataset is a proprietary 24-month multi-source corpus from a financial risk environment. It contains over 20 million users, 1.2 billion interactions, and 15
                  - generic "Page ⁨7⁩" [ref=e1395]:
                    - generic [ref=e1397]:
                      - text: "FRAA for Financial Risk Assessment 7 heterogeneous data sources. Records include transaction events, account status snapshots, product holdings, macroeconomic series, and timestamped news or regulatory signals. The target indicates whether a material adverse event, such as default, severe delinquency, or forced liquidation, occurs within the next 30 days. We use a strict chronological split. Historical records are used to build look- back features and timestamp-valid knowledge-base entries. The model is trained on a 12-month period, tuned on the following month, and evaluated on the fi- nal month. No validation or test-period documents are made available to earlier predictions. We report Log Loss for probability calibration, Recall@1/Recall@5 for risk-review ranking, area under the receiver operating characteristic curve (AUC) for feature-group occlusion, and longest common subsequence ROUGE (ROUGE-L) for explanation overlap with expert-written references. The evaluation protocol follows the main failure modes of financial risk sys- tems. Log Loss measures whether predicted probabilities are useful for down- stream thresholding and risk appetite control. Recall@1 and Recall@5 measure the ranking quality of the highest-risk cases, which are the cases most likely to be reviewed by analysts. The chronological split and timestamp-valid retrieval rule are used for every model variant, including ablations, so that performance differences do not arise from different access to future information. 4.2 Baselines and Training Details We compare FRAA with a deployed Random Forest (RF), RF with static knowledge-base (KB) features, XGBoost, LSTM, and a non-retrieval Trans- former. These baselines cover the main operational choices in the target setting: tabular ensembles, tabular ensembles with manually attached external features, recurrent sequence modeling, and neural sequence modeling without retrieval. We retain the deployed tree-based baseline because credit-scoring studies re-"
                      - generic [ref=e1398]:
                        - text: peatedly find tree ensembles difficult to displace on heterogeneous tabular data
