                      - text: "Table 2. Product-scenario adaptation measured as relative Recall@1/Recall@5 lift (%) over the scenario-specific baseline. Adaptation method Credit card Mortgage Scenario-specific baseline 0.00 / 0.00 0.00 / 0.00 LP-FT (<1% params) +3.14 / +2.97 +2.88 / +2.45 LoRA-FT (<5% params) +13.49 / +12.63 +11.72 / +10.88 FRAA full-FT +18.21 / +17.10 +16.45 / +15.33 Full-FT gives the largest gains in both credit-card risk scoring and mortgage delinquency forecasting. LoRA-FT retains much of this improvement with fewer updated parameters, suggesting that the learned representation is reusable across related products. These results are offline scenario-transfer evidence and should not be read as deployment validation. An offline replay under a fixed risk-appetite constraint follows the same or- dering as the predictive results: models with larger Log Loss reductions also give higher estimated decision utility. We treat this only as directional decision- support evidence, not as a causal claim about deployed outcomes. 4.6 Ablation and Analysis Architectural Components The component ablation removes one design choice at a time while keeping the training split, feature availability, and eval-"
