                      - text: Table 3 isolates the contribution of dynamic transactions (-Dyn), temporal encoding (-TE), and knowledge retrieval (-KB). All three removals degrade the full model, confirming that the gains do not come from a single add-on. Re- moving the knowledge component increases Log Loss from 0.5163 to 0.5385 and decreases Recall@5 from 0.4185 to 0.4023, supporting the retrieval-augmented design. Removing temporal encoding also reduces performance, which is con- sistent with the irregular timing of financial events. The -Dyn variant remains stronger than the non-retrieval Transformer. External evidence and temporal en- coding therefore compensate for some missing dynamic transaction information, but they do not replace it. Context Window We varied the behavioral lookback window to test how much history the model needs. Performance improved from 30 to 120 days and then slightly declined at 180 days, so the main experiments use the 120-day window. This pattern suggests that older events add limited signal and may introduce noise. Feature Groups and Retrieval Depth We next examine two complementary
                      - generic [ref=e1429]:
                        - text: "views: feature-family occlusion and retrieval depth. Figure 3 summarizes both"
                        - link [ref=e1430] [cursor=pointer]:
