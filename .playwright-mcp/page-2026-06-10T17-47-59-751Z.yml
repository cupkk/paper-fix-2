                - textbox "Source Editor editing" [active] [ref=e502]:
                  - generic [ref=e504]: "Table~\\ref{tab:component_ablation} isolates the contribution of dynamic transactions (-Dyn), temporal encoding (-TE), and knowledge retrieval (-KB). All three removals degrade the full model, confirming that the gains do not come from a single add-on. Removing the knowledge component increases Log Loss from 0.5163 to 0.5385 and decreases Recall@5 from 0.4185 to 0.4023, supporting the retrieval-augmented design. Removing temporal encoding also reduces performance, which is consistent with the irregular timing of financial events. The -Dyn variant remains stronger than the non-retrieval Transformer. External evidence and temporal encoding therefore compensate for some missing dynamic transaction information, but they do not replace it."
                  - generic [ref=e507]: "\\subsubsection{Feature Groups and Retrieval Depth}"
                  - generic [ref=e508]: "We next examine the gain from two complementary views: feature-family occlusion and retrieval depth. Figure~\\ref{fig:retrieval_depth} summarizes both analyses using the same values as the feature-family occlusion and retrieval-depth experiments. Knowledge-retrieved context produces the largest AUC drop, followed by transaction dynamics. Static profile variables still contribute, but they are less influential than time-sensitive behavioral and external-evidence signals. Retrieval depth also has a clear optimum in this setting: one or three documents provide insufficient external context, whereas seven or ten documents slightly degrade both metrics. We therefore use $K=5$ in the main experiments. This pattern is expected in retrieval-augmented risk scoring: too few documents leave the model with limited external context, whereas too many documents introduce loosely related evidence that weakens the fused representation."
                  - generic [ref=e511]: "\\begin{figure}"
                  - generic [ref=e512]: \centering
                  - generic [ref=e513]: "\\includegraphics[width=\\textwidth]{retrieval_depth_sensitivity.pdf}"
                  - generic [ref=e514]: "\\caption{Retrieval evidence analysis. (a) Feature-family occlusion measured by AUC drop. (b) Retrieval-depth sensitivity, with $K=5$ selected for the main experiments.}"
                  - generic [ref=e515]: "\\label{fig:retrieval_depth}"
                  - generic [ref=e516]: "\\end{figure}"
                  - generic [ref=e519]: "\\subsection{Further Evaluation}"
                  - generic [ref=e522]: "\\subsubsection{Explanation Quality}"
                  - generic [ref=e523]: Beyond risk scores, FRAA is intended to support human review by explaining why a high-risk case was flagged. The goal is not to automate the final decision, but to make the model output easier to inspect. We therefore evaluate the generated explanations using both expert ratings and lexical overlap with reference explanations.
                  - generic [ref=e526]: "\\begin{figure}"
                  - generic [ref=e527]: \centering
                  - generic [ref=e528]: "\\includegraphics[width=\\textwidth]{explanation_quality_evaluation.pdf}"
                  - generic [ref=e529]: "\\caption{Explanation-quality evaluation. (a) Expert-rated faithfulness and readability on a five-point scale. (b) ROUGE-L overlap with reference explanations.}"
                  - generic [ref=e530]: "\\label{fig:explanation_quality}"
                  - generic [ref=e531]: "\\end{figure}"
                  - generic [ref=e534]: "Five domain experts evaluated 1,000 high-risk test predictions. Figure~\\ref{fig:explanation_quality} reports higher faithfulness, readability, and ROUGE-L for FRAA than for a template baseline that lists the top three feature groups. The full model obtains faithfulness of 4.32/5, readability of 4.51/5, and ROUGE-L of 0.4131. The result suggests that the explanation head adds information beyond feature enumeration. The expert ratings should be interpreted as an auditability signal, not as evidence that generated text is sufficient for automatic decision making."
                  - generic [ref=e537]: "\\subsubsection{Efficiency Analysis}"
                  - generic [ref=e538]: The final evaluation asks whether the added retrieval and fusion steps are practical for an analyst-facing review loop.
                  - generic [ref=e541]: "\\begin{figure}"
                  - generic [ref=e542]: \centering
                  - generic [ref=e543]: "\\includegraphics[width=0.55\\textwidth]{inference_latency_throughput.pdf}"
                  - generic [ref=e544]: "\\caption{Inference latency and throughput under the tested batch-size-64 serving configuration.}"
                  - generic [ref=e545]: "\\label{fig:latency}"
                  - generic [ref=e546]: "\\end{figure}"
                  - generic [ref=e549]: "FRAA is slower than tree ensembles because it performs retrieval and neural sequence encoding. Even so, the tested latency in Fig.~\\ref{fig:latency} remains compatible with interactive risk review: FRAA requires 15.7 ms per query and reaches 4,070 queries/s in the tested serving configuration. The retrieval step accounts for approximately 4.2 ms of the total latency. Throughput is lower than for tabular baselines, but remains above the level required for batched offline scoring and analyst triage in the tested configuration."
                  - generic [ref=e552]: "\\subsection{Limitations and Reproducibility}"
                  - generic [ref=e555]: The evaluation uses a proprietary financial dataset that cannot be publicly released because it contains sensitive user-level risk and transaction information. This limits independent replication. To support reproducibility within this constraint, we report the data scale, feature families, chronological split, training configuration, retrieval depth, baselines, and ablation settings. The knowledge base is timestamped, and retrieval uses only documents available at or before the scoring time. These details make the experimental protocol auditable even when the raw records cannot be shared.
                  - generic [ref=e558]: "Several claims should be read within this scope. First, the results establish performance in one large multi-source financial environment, not universal transfer across institutions. Second, the current evaluation does not report multi-seed variance or formal statistical significance tests because the available audit record contains one fixed proprietary chronological split rather than repeated independent training runs. Third, the explanation evaluation measures expert-perceived faithfulness and readability for high-risk test predictions. It does not remove the need for human oversight in regulated decisions. Future work should add public benchmark evaluations where legally possible, repeatability analysis under multiple splits or random seeds, institution-level transfer tests including parameter-efficient adaptation methods such as LoRA \\cite{hu2022lora}, and governance mechanisms for retrieved evidence that may become outdated or disputed."
                  - generic [ref=e561]: "\\section{Conclusion}"
                  - generic [ref=e564]: This paper presented FRAA, a retrieval-augmented model for explainable financial risk assessment. The main finding is that retrieval helps risk scoring most when external evidence is time-valid and fused with temporal user behavior, rather than attached as a static feature. On a large-scale proprietary multi-source dataset, FRAA obtains the lowest Log Loss and highest Recall@5 among the evaluated models. The ablation, occlusion, and retrieval-depth analyses trace the gains mainly to timestamp-valid external evidence, with five retrieved documents giving the best trade-off between evidence coverage and noise. Explanation and latency evaluations further indicate that the model can support analyst-facing review under the tested serving configuration. Taken together, the results suggest that external evidence retrieval is most valuable when it is constrained by time validity, fused with temporal user behavior, and exposed through auditable explanations.
