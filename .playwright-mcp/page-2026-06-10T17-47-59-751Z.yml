                        - link [ref=e676] [cursor=pointer]:
                          - /url: "#figure.5"
                      - text: "interactive risk review: FRAA requires 15.7 ms per query and reaches 4,070 queries/s in the tested serving configuration. The retrieval step accounts for approximately 4.2 ms of the total latency. Throughput is lower than for tabular baselines, but remains above the level required for batched offline scoring and analyst triage in the tested configuration. 4.7 Limitations and Reproducibility The evaluation uses a proprietary financial dataset that cannot be publicly re- leased because it contains sensitive user-level risk and transaction information. This limits independent replication. To support reproducibility within this con- straint, we report the data scale, feature families, chronological split, training configuration, retrieval depth, baselines, and ablation settings. The knowledge base is timestamped, and retrieval uses only documents available at or before the scoring time. These details make the experimental protocol auditable even when the raw records cannot be shared. Several claims should be read within this scope. First, the results establish performance in one large multi-source financial environment, not universal trans- fer across institutions. Second, the current evaluation does not report multi-seed variance or formal statistical significance tests because the available audit record contains one fixed proprietary chronological split rather than repeated indepen- dent training runs. Third, the explanation evaluation measures expert-perceived faithfulness and readability for high-risk test predictions. It does not remove the need for human oversight in regulated decisions. Future work should add public benchmark evaluations where legally possible, repeatability analysis under mul- tiple splits or random seeds, institution-level transfer tests including parameter-"
                      - generic [ref=e677]:
                        - text: efficient adaptation methods such as LoRA [18], and governance mechanisms for
                        - link [ref=e678] [cursor=pointer]:
                          - /url: "#cite.hu2022lora"
                      - text: retrieved evidence that may become outdated or disputed. 5 Conclusion This paper presented FRAA, a retrieval-augmented model for explainable finan- cial risk assessment. The main finding is that retrieval helps risk scoring most when external evidence is time-valid and fused with temporal user behavior, rather than attached as a static feature. On a large-scale proprietary multi- source dataset, FRAA obtains the lowest Log Loss and highest Recall@5 among the evaluated models. The ablation, occlusion, and retrieval-depth analyses trace the gains mainly to timestamp-valid external evidence, with five retrieved docu- ments giving the best trade-off between evidence coverage and noise. Explanation and latency evaluations further indicate that the model can support analyst- facing review under the tested serving configuration. Taken together, the results suggest that external evidence retrieval is most valuable when it is constrained by time validity, fused with temporal user behavior, and exposed through auditable explanations.
