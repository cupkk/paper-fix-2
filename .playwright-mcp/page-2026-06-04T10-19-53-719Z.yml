                  - generic [ref=e1118]: "\\textbf{FRAA (full)} & \\best{0.5163} & \\best{0.4185} \\\\"
                  - generic [ref=e1119]: \bottomrule
                  - generic [ref=e1120]: "\\end{tabular}"
                  - generic [ref=e1121]: "\\end{table}"
                  - generic [ref=e1124]: "Table~\\ref{tab:component_ablation} isolates the contribution of dynamic transactions (-Dyn), temporal encoding (-TE), and knowledge retrieval (-KB). Removing the knowledge component causes the largest degradation among FRAA variants: Log Loss increases from 0.5163 to 0.5385, and Recall@5 decreases from 0.4185 to 0.4023. This result supports the retrieval-augmented design. Removing temporal encoding also reduces performance, which is consistent with the irregular timing of financial events. The -Dyn variant remains stronger than the non-retrieval Transformer. External evidence and temporal encoding therefore compensate for some missing dynamic transaction information, but they do not replace it."
                  - generic [ref=e1127]: "\\subsection{Feature Groups and Retrieval Depth}"
                  - generic [ref=e1128]: "We next examine the gain from two complementary views: feature-family occlusion and retrieval depth."
                  - generic [ref=e1131]: "\\begin{table}"
                  - generic [ref=e1132]: \centering
                  - generic [ref=e1133]: "\\caption{Feature-group occlusion. A larger AUC drop indicates a more important feature family.}"
