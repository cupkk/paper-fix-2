                  - generic "Page ⁨1⁩" [ref=e697]:
                    - generic [ref=e699]: "FISCAL: Sparse Cross-Modal Multi-Agent Learning for Explainable Financial Risk Surveillance Anonymous Authors Abstract. Financial risk surveillance must combine heterogeneous time- series feeds, tolerate missing inputs, and return explanations that ana- lysts can inspect. Many existing models collapse all inputs into a single multivariate sequence, which obscures modality-specific evidence and offers limited precedent-based reasoning. We propose Fiscal ( F inancial I ntelligence via S parse C ross-modal A daptive L earning), a multimodal method for explainable financial risk classification under changing modal- ity availability. Fiscal combines volatility-aware symbolic tokenization with explicit missing and extreme-event tokens, risk-modulated sparse at- tention for temporal encoding, multi-agent cross-modal coordination with retrieval-augmented case memory, and prototype-aligned expert routing for attributable decisions. On three financial risk benchmarks covering operational stress, payment fraud, and credit migration, Fiscal improves macro-F1 by up to 4.5 percentage points over the best-performing base- line and degrades by only 6–8% under 40% modality dropout. Ablations identify retrieval memory and volatility-aware tokenization as the largest contributors, while latency measurements show that risk-modulated spar- sity reduces computation relative to dense cross-modal attention. The results indicate that sparse, precedent-aware multimodal reasoning is well suited to financial risk surveillance. Keywords: Multimodal learning · Missing modalities · Sparse attention · Multi-agent learning · Financial risk surveillance. 1 Introduction Financial risk surveillance, including fraud detection, credit migration prediction, and operational risk monitoring, now depends on the joint analysis of transaction logs, order-book snapshots, news feeds, and alternative data [ ? , ? , ? , ? ]. These feeds form multimodal time series that encode market dynamics and behavioral patterns from different viewpoints. They are not interchangeable: each modality has its own sampling rate, noise profile, and sensitivity to risk events. Feeds may also disappear because of latency, outages, or selective reporting, producing changing patterns of modality missingness. A deployable model must combine accurate classification, low-latency inference, missing-modality robustness, and explanations that analysts can inspect. Existing approaches often reduce multimodal time series to a single multi- variate representation, which weakens modality-specific reasoning. Sensor-fusion"
