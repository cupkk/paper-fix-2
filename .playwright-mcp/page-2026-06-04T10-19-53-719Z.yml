                  - generic [ref=e1135]: "\\begin{tabular}{lc}"
                  - generic [ref=e1136]: \toprule
                  - generic [ref=e1137]: "\\textbf{Occluded feature group} & \\textbf{AUC drop (\\%)} \\\\"
                  - generic [ref=e1138]: \midrule
                  - generic [ref=e1139]: Knowledge-retrieved context & 3.92 \\
                  - generic [ref=e1140]: "\\rowcolor{tablerowalt}"
                  - generic [ref=e1141]: Transaction dynamics & 2.87 \\
                  - generic [ref=e1142]: Macroeconomic indicators & 1.55 \\
                  - generic [ref=e1143]: "\\rowcolor{tablerowalt}"
                  - generic [ref=e1144]: Quasi-static profile & 0.93 \\
                  - generic [ref=e1145]: \bottomrule
                  - generic [ref=e1146]: "\\end{tabular}"
                  - generic [ref=e1147]: "\\end{table}"
                  - generic [ref=e1150]: "The occlusion results in Table~\\ref{tab:feature_occlusion} are consistent with the component ablation. Knowledge-retrieved context produces the largest AUC drop, followed by transaction dynamics. Static profile variables still contribute, but they are less influential than time-sensitive behavioral and external-evidence signals. This ordering indicates that much of the model's advantage comes from information that changes over time rather than from static attributes alone."
