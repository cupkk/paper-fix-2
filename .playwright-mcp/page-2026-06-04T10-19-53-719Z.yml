                  - generic [ref=e1173]: "Table~\\ref{tab:retrieval_depth} indicates that retrieval depth has a clear optimum in this setting. One or three documents provide insufficient external context. Seven or ten documents slightly degrade both metrics. We therefore use $K=5$ in the main experiments. The degradation at larger $K$ is small, but it is consistent with the retrieval-noise trade-off: broader retrieval increases coverage while introducing less relevant documents into the fusion module."
