                      - text: FRAA for Financial Risk Assessment 7 tabular ensembles, tabular ensembles with manually attached external features, recurrent sequence modeling, and neural sequence modeling without retrieval. We retain the deployed tree-based baseline because prior credit-scoring and
                      - generic [ref=e736]:
