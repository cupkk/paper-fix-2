                        - link [ref=e739] [cursor=pointer]:
                          - /url: "#cite.arik2021tabnet"
                      - text: heterogeneous tabular data [3,8,2]. All baselines use the same chronological split and available feature families. FRAA is implemented in PyTorch and trained with AdamW, learning rate 1 × 10 − 4 , weight decay 1 × 10 − 5 , batch size 64, and a maximum budget of 50 epochs. The selected checkpoint is the one with the lowest validation Log Loss. Hyperparameters are chosen on the validation month and then fixed for the test month. For retrieval variants, document embeddings are constructed offline and indexed before evaluation. During scoring, the retrieval pool is filtered by timestamp before nearest-neighbor search. This step is essential because a high- capacity retrieval model could otherwise use documents that were unavailable when the decision should have been made. 4.3 Evaluation Questions The experiments address four questions. First, does retrieval-augmented evi- dence change calibrated risk prediction and high-risk ranking relative to tree- based and neural baselines? Second, do the learned representations transfer to re- lated financial scenarios, or are they tied to a single product-specific task? Third, which components account for the observed gains, especially the dynamic trans- action encoder, time-gap encoding, and knowledge retrieval module? Fourth, are the explanations and latency compatible with analyst-facing risk review? The following sections follow this order, separating the main predictive result from auxiliary analyses. 4.4 Main Results
