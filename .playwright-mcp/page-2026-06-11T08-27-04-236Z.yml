                      - text: ports higher faithfulness, readability, and ROUGE-L for FRAA than for a tem- plate baseline that lists the top three feature groups. The full model obtains faithfulness of 4.32/5, readability of 4.51/5, and ROUGE-L of 0.4131. The result suggests that the explanation head adds information beyond feature enumera- tion. The expert ratings should be interpreted as an auditability signal, not as evidence that generated text is sufficient for automatic decision making. Efficiency Analysis The final evaluation asks whether the added retrieval and fusion steps are practical for an analyst-facing review loop. We benchmark
                      - generic [ref=e764]:
                        - text: the representative models under the same batch-size-64 serving configuration.
                        - link [ref=e765] [cursor=pointer]:
                          - /url: "#table.7"
                      - text: "Table 7 reports mean per-query latency and throughput. FRAA is slower than the tabular baselines because it performs retrieval and neural sequence encoding, but the tested latency remains compatible with inter- active risk review: the full model requires 15.7 ms per query and reaches 4,070 queries/s. The retrieval step accounts for approximately 4.2 ms of the total la- tency. Throughput is lower than for RF or XGBoost, yet it remains above the level required for batched offline scoring and analyst triage in the tested config- uration. 5 Conclusion This paper presented FRAA, a retrieval-augmented model for explainable finan- cial risk assessment. The main finding is that retrieval helps risk scoring most when external evidence is time-valid and fused with temporal user behavior, rather than attached as a static feature. On a large-scale proprietary multi-source dataset, FRAA obtains the lowest Log Loss and highest Recall@5 among the evaluated models. The ablation, occlusion, incremental feature-addition, context- window, and retrieval-depth analyses trace the gains mainly to timestamp-valid external evidence and dynamic behavior, with five retrieved documents and a 120-day behavioral window giving the best observed trade-offs. Scenario adap- tation and offline replay analyses further suggest that the same representation can transfer to related financial products and may improve risk-adjusted util- ity, although the RAR values remain offline estimates rather than online A/B results. Explanation and latency evaluations indicate that the model can sup- port analyst-facing review under the tested serving configuration. The evalua- tion is limited to one proprietary financial environment, so future work should"
                  - generic "Page ⁨14⁩" [ref=e768]:
