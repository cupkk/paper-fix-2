                  - generic [ref=e519]: "FRAA is slower than tree ensembles because it performs retrieval and neural sequence encoding. Even so, the tested latency in Table~\\ref{tab:latency} remains compatible with interactive risk review. The retrieval step accounts for approximately 4.2 ms of the total latency. Throughput is lower than for tabular baselines, but remains above the level required for batched offline scoring and analyst triage in the tested configuration."
                  - generic [ref=e522]: "\\begin{table}"
                  - generic [ref=e523]: \centering
                  - generic [ref=e524]: "\\caption{Offline replay analysis of risk-adjusted revenue (RAR) utility.}"
                  - generic [ref=e525]: "\\label{tab:business}"
