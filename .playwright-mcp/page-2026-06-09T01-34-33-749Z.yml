                  - generic [ref=e851]: "\\end{table}"
                  - generic [ref=e854]: "The offline replay in Table~\\ref{tab:business} connects calibration with downstream utility under a fixed risk-appetite constraint. We report this as offline decision-support evidence, not as a claim of causal online revenue impact. The analysis checks whether lower Log Loss corresponds to a practically meaningful ordering of cases under a fixed review budget. Figure~\\ref{fig:operational_summary} visualizes the scenario adaptation, explanation quality, serving cost, and offline utility results together."
                  - generic [ref=e857]: "\\begin{figure}"
                  - generic [ref=e858]: \centering
                  - generic [ref=e859]: "\\includegraphics[width=\\textwidth]{operational_evaluation_summary.pdf}"
                  - generic [ref=e860]: "\\caption{Operational evaluation of FRAA. (a) Scenario-transfer Recall@5 lift. (b) Explanation-quality gain. (c) Latency-throughput trade-off. (d) Offline replay utility.}"
                  - generic [ref=e861]: "\\label{fig:operational_summary}"
                  - generic [ref=e862]: "\\end{figure}"
                  - generic [ref=e865]: "\\section{Limitations and Reproducibility}"
                  - generic [ref=e868]: The evaluation uses a proprietary financial dataset that cannot be publicly released because it contains sensitive user-level risk and transaction information. This limits independent replication. To support reproducibility within this constraint, we report the data scale, feature families, chronological split, training configuration, retrieval depth, baselines, and ablation settings. The knowledge base is timestamped, and retrieval uses only documents available at or before the scoring time. These details make the experimental protocol auditable even when the raw records cannot be shared.
                  - generic [ref=e871]: Several claims should be read within this scope. First, the results establish performance in one large multi-source financial environment, not universal transfer across institutions. Second, the business-utility analysis is based on offline replay and should not be interpreted as causal online impact evidence. Third, the current evaluation does not report multi-seed variance or formal statistical significance tests because the available audit record contains one fixed proprietary chronological split rather than repeated independent training runs. Fourth, the explanation evaluation measures expert-perceived faithfulness and readability for high-risk test predictions. It does not remove the need for human oversight in regulated decisions. Future work should add public benchmark evaluations where legally possible, repeatability analysis under multiple splits or random seeds, institution-level transfer tests, and governance mechanisms for retrieved evidence that may become outdated or disputed.
                  - generic [ref=e874]: "\\section{Conclusion}"
                  - generic [ref=e877]: This paper presented FRAA, a retrieval-augmented model for explainable financial risk assessment. FRAA combines time-aware sequence modeling, timestamp-valid knowledge retrieval, cross-attention evidence fusion, calibrated risk scoring, and explanation generation. On a large-scale proprietary multi-source dataset, FRAA achieves the lowest Log Loss and highest Recall@5 among the evaluated models. Ablations show that dynamic behavior, temporal encoding, and retrieval provide complementary evidence, while feature-group occlusion identifies knowledge-retrieved context as the strongest feature-family signal. Retrieval-depth analysis selects five documents as the best trade-off between evidence coverage and noise. Additional evaluations examine cross-scenario transfer, explanation quality, and tested latency. Taken together, the results suggest that external evidence retrieval is most valuable when it is constrained by time validity, fused with temporal user behavior, and exposed through auditable explanations.
                  - generic [ref=e880]: "\\bibliographystyle{splncs04}"
                  - generic [ref=e881]: "\\bibliography{submission_pricai2026}"
                  - generic [ref=e884]: "\\end{document}"
