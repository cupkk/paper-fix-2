                      - text: "level retrieval models [12,33]. The timestamp restriction prevents future docu- ments from leaking into the prediction. The retrieved document embeddings are fused with the user state using cross- attention: ˜ h t = CrossAttn \x10 h ( L ) t W Q , D t W K , D t W V \x11 , (5) where D t ∈ R K × D e stacks the embeddings of retrieved documents, D e is the document-embedding dimension, and W Q , W K , and W V are trainable projec- tion matrices. The fused representation ˜ h t is passed to the scoring and explana- tion heads. Cross-attention is used instead of simple concatenation because the relevance of external evidence depends on the user state. For example, a macroe- conomic commentary may matter for users with concentrated sector exposure, but may be weakly relevant for users whose recent transactions do not involve that sector. 3.5 Risk Scoring and Explanation Generation The risk head maps the fused representation to a calibrated probability: ˆ r t = σ ( w ⊤ r ˜ h t + b r ) . (6) where σ ( · ) is the sigmoid function, w r is a trainable risk-head vector, and b r is a scalar bias. In parallel, the explanation head generates a concise textual justifi- cation from the retrieved documents and feature-group importance signals. The training objective combines per-instance binary cross-entropy for risk prediction with a supervised explanation-fidelity term: L = − y t log ˆ r t − (1 − y t ) log(1 − ˆ r t ) + λ L exp (ˆ e t , e ref t ) , (7) where ˆ e t is the generated explanation, e ref t is an expert or rule-supported refer- ence explanation, L exp penalizes mismatches with reference evidence and feature- group rationales, and λ balances prediction and explanation supervision. The explanation head is trained to refer to retrieved evidence and influential feature groups, rather than to produce a free-form rationale disconnected from the risk score. In all reported experiments, the Transformer uses 8 attention blocks, hid- den dimension 256, and embedding dimension 512. Retrieval depth is K = 5"
