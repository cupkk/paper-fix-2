                  - generic "Page ⁨13⁩" [ref=e534]:
                    - generic [ref=e536]: "FRAA for Financial Risk Assessment 13 Faithfulness Readability 3.6 3.8 4.0 4.2 4.4 4.6 Expert score (1-5) 3.89 4.02 4.32 4.51 a Template FRAA Template FRAA 0.25 0.30 0.35 0.40 0.45 ROUGE-L 0.3026 0.4131 b Fig. 4. Explanation-quality evaluation. (a) Expert-rated faithfulness and readability on a five-point scale. (b) ROUGE-L overlap with reference explanations. Table 8. Inference latency and throughput comparison under batch size 64. Model Latency (ms/query) Throughput (queries/s) RF + KB features 1.9 12,530 XGBoost 2.1 11,200 LSTM 8.3 5,910 Transformer 12.4 4,320 FRAA (full) 15.7 4,070 FRAA is slower than tabular baselines because it performs retrieval and neu- ral sequence encoding, but the tested latency remains compatible with interac- tive review: the full model requires 15.7 ms/query and reaches 4,070 queries/s. Retrieval accounts for approximately 4.2 ms of the total latency. Throughput remains sufficient for batched offline scoring and analyst triage in the tested configuration. 5 Conclusion This paper presented FRAA, a retrieval-augmented model for explainable finan- cial risk assessment. On a large-scale proprietary multi-source dataset, FRAA obtains the lowest Log Loss and highest Recall@5 among the evaluated mod- els. The ablation, occlusion, incremental feature-addition, context-window, and retrieval-depth analyses trace the gains mainly to timestamp-valid external ev- idence and dynamic behavior, with five retrieved documents and a 120-day be- havioral window giving the best observed trade-offs. Scenario adaptation and offline replay analyses suggest that the same representation can transfer to re- lated financial products and may improve risk-adjusted utility, although the RAR values remain offline estimates rather than online A/B results. Explanation and latency evaluations indicate that the model can support analyst-facing review under the tested serving configuration. The evaluation is limited to one propri- etary financial environment, so future work should add public benchmarks where legally possible, repeatability analysis under multiple splits or random seeds, and institution-level transfer tests. Taken together, the results suggest that external evidence retrieval is most valuable when it is time-valid, fused with temporal behavior, and exposed through auditable explanations."
